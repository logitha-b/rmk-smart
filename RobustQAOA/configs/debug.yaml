# DEBUG MODE CONFIGURATION
# Only for development/testing. NEVER use debug results in final research report.

mode: debug

# Dataset
dataset: cifar100
data_dir: ./data
num_workers: 2

# Training
batch_size: 128
epochs: 5                      # Short for debug
learning_rate: 0.01
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
scheduler: cosine
seed: 42

# Model
prunable_layer: conv1           # The 16-channel bottleneck layer identifier
num_prunable_channels: 16

# Memory budget (fraction of total prunable-layer memory, e.g. 0.6 means keep ≤60%)
memory_budget_fraction: 0.60

# QUBO hyperparameters
alpha: 1.0                      # weight for clean performance
beta: 1.0                       # weight for adversarial robustness
gamma: 0.5                      # weight for pairwise synergy
lambda_penalty: 5.0             # quadratic memory-constraint penalty

# QAOA
qaoa_depth: 1                   # QAOA p layers (debug: shallow)
qaoa_shots: 512
qaoa_optimizer: COBYLA
qaoa_max_iterations: 50

# Adversarial attacks
fgsm_epsilon: 0.03
pgd_epsilon: 0.03
pgd_step_size: 0.007
pgd_steps: 10

# Defender-attacker loop
defender_attacker_rounds: 2     # Short for debug

# Evaluation
val_subset_size: 200            # samples used for expensive ablation in debug
eval_samples: 200
attack_pool_size: 100

# Ablation
run_ablations: false

# Debug flag
debug_mode: true
